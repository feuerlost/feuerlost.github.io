cv:
  name: Zeyu Zhang
  email: zhangzeyu24@mails.ucas.ac.cn
  website: https://feuerlost.github.io

  social_networks:
    - network: GitHub
      username: feuerlost

  sections:
    Links:
      - label: GitHub
        details: "[github.com/feuerlost](https://github.com/feuerlost)"

    Education:
      - institution: University of Chinese Academy of Sciences (UCAS)
        location: Beijing, China
        area: Artificial Intelligence
        studyType: B.Eng.
        start_date: Sep. 2024
        end_date: Expected Jun. 2028
        courses:
          - "Selected Coursework: Data Structures and Algorithms, Probability and Statistics, Discrete Mathematics, Signals and Systems, Principles of Artificial Intelligence, Pattern Recognition and Machine Learning"
        highlights:
          - "GPA: 3.91/4.00 | Rank: 6/68"

    Experience:
      - company: Institute of Automation, CAS | Mindtrix Technology
        position: Neural Representation Learning for Embodied Control
        start_date: Jul. 2026
        end_date: Present
        summary: "Advisors: Bing Liu, Yinghao Li, Weihsien Lee"
        highlights:
          - Developing a neural encoder to extract behavior-relevant representations from pre-movement M1/PMd spiking activity for conditioning embodied control policies.
          - Established within-session Center-Out decoding baselines and evaluated neural representations across cortical regions, temporal windows, and model architectures.
          - Built an eight-direction Center-Out manipulation environment in MuJoCo and developed a fine-tuning and evaluation pipeline for the π0.5 vision-language-action model.

      - company: Institute of Automation, CAS | Mindtrix Technology
        position: Computer Vision Pipeline for Visual Prostheses
        start_date: Jul. 2025
        end_date: Aug. 2025
        summary: "Advisors: Bing Liu, Xing Li"
        highlights:
          - Reviewed depth estimation, semantic segmentation, visual representation, and neural decoding methods for visual prostheses; assisted with RealSense-based experimental data collection.
          - Prototyped a vision-to-phosphene pipeline using computer vision models and dynaphos.

    Publications:
      - title: "NI-ACT: A Neural Intent Interface for Brain-Embodied Manipulation"
        authors:
          - Yinghao Li
          - Weihsien Lee
          - Zeyu Zhang
          - Canyang Zhao
          - Bing Liu
        publisher: Manuscript under review
        releaseDate: 2026

    Skills:
      - name: Technical
        keywords: "Python, C, PyTorch, Git, Linux, Shell, MuJoCo, robosuite, LeRobot"

    Languages:
      - name: Chinese
        summary: Native
      - name: English
        summary: "TOEFL iBT: XXX"

    Honors and Awards:
      - title: First-class scholarship for undergraduate students
        date: 2025
        summary: Top 5%

    Leadership & Activities:
      - bullet: "**President, Zhiyuan Guitar Club; Co-founder and President, UCASGA** — Sep. 2025–Jul. 2026. Led the merger of two student music organizations and operations of two rehearsal spaces; organized 16 live shows, eight acoustic performances, School Live Bar, and the Summer Music Festival."
      - bullet: "**Venue Operations Team Lead, UCAS Grassland Music Festival** — Apr. 2026–Jun. 2026. Led venue operations, backstage logistics, and event coordination for a campus music festival."

